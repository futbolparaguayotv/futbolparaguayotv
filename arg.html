<!DOCTYPE html>
<html lang="es">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Laguna Paiva IPTV</title>
   <script src="https://cdn.tailwindcss.com"></script>
   <script src="https://unpkg.com/lucide@latest"></script>
   <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
   <style>
       @import url('https://fonts.googleapis.com/css2?family=Onest:wght@300;400;700;900&display=swap');
      
       body {
           font-family: 'Onest', sans-serif;
           background-color: #050505;
           color: white;
           margin: 0;
           overflow: hidden;
           height: 100vh;
       }
       /* Layout Base */
       .grid-container {
           display: grid;
           grid-template-areas: "nav main";
           grid-template-columns: 350px 1fr;
           height: 100vh;
       }
       /* Ajustes para Celulares (Pantalla vertical) */
       @media (max-width: 1024px) {
           .grid-container {
               grid-template-areas:
                   "main"
                   "nav";
               grid-template-columns: 1fr;
               grid-template-rows: 35vh 65vh;
           }
       }
       /* Forzar Landscape en Fullscreen */
       #player-section:fullscreen {
           width: 100vw;
           height: 100vh;
           background: black;
       }
       #sidebar { grid-area: nav; }
       #player-section { grid-area: main; }
       .custom-scroll::-webkit-scrollbar { width: 6px; }
       .custom-scroll::-webkit-scrollbar-track { background: #0a0a0a; }
       .custom-scroll::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }
       .active-channel {
           background: linear-gradient(90deg, #1e3a8a 0%, #09090b 100%) !important;
           border-left: 4px solid #3b82f6 !important;
       }
       .video-gradient-top {
           background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, transparent 100%);
       }
       .video-gradient-bottom {
           background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
       }
       video { outline: none; object-fit: contain; }
   </style>
</head>
<body>
<div class="grid-container">
  
   <aside id="sidebar" class="bg-zinc-950 border-r border-zinc-800 flex flex-col overflow-hidden">
       <div class="p-5 space-y-4">
           <div class="flex items-center gap-3">
               <div class="bg-blue-600 p-2 rounded-lg shadow-lg shadow-blue-900/20">
                   <i data-lucide="tv-2" class="text-white w-5 h-5"></i>
               </div>
               <h1 class="text-xl font-black tracking-tighter italic uppercase">LAGUNA PAIVA <span class="text-blue-500">IPTV</span></h1>
           </div>
          
           <div class="relative">
               <i data-lucide="search" class="absolute left-3 top-3 w-4 h-4 text-zinc-500"></i>
               <input id="searchInput" type="text" placeholder="Buscar entre canales..."
                      class="w-full bg-zinc-900 border border-zinc-800 rounded-xl py-2 pl-10 pr-4 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
           </div>
       </div>
       <div id="channelList" class="flex-1 overflow-y-auto custom-scroll px-3 pb-10 space-y-1">
           </div>
   </aside>

   <main id="player-section" class="relative group bg-black flex flex-col overflow-hidden">
       <div class="absolute top-0 left-0 w-full z-20 p-6 md:p-10 video-gradient-top opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none">
           <div class="flex items-center gap-4 md:gap-6">
               <img id="currentLogo" src="" class="w-12 h-12 md:w-20 md:h-20 object-contain bg-white rounded-lg p-1.5 shadow-2xl" onerror="this.style.display='none'">
               <div>
                   <span id="currentCat" class="text-blue-500 font-bold text-[10px] md:text-xs uppercase tracking-[0.2em]">SINTONIZANDO</span>
                   <h2 id="playerTitle" class="text-2xl md:text-5xl font-black uppercase leading-tight">Selecciona un canal</h2>
               </div>
           </div>
       </div>
       <div class="flex-1 relative flex items-center justify-center bg-zinc-950">
           <video id="mainVideo" class="w-full h-full max-h-screen" playsinline crossorigin="anonymous"></video>
           <div id="loader" class="absolute inset-0 flex items-center justify-center bg-black/50 z-10 hidden">
               <div class="animate-spin rounded-full h-14 w-14 border-4 border-blue-600 border-t-transparent"></div>
           </div>
       </div>
       <div class="absolute bottom-0 left-0 w-full z-20 p-6 md:p-8 video-gradient-bottom opacity-0 group-hover:opacity-100 transition-opacity duration-500">
           <div class="flex items-center justify-between gap-4">
               <div class="flex items-center gap-4 md:gap-8">
                   <button onclick="togglePlay()" class="hover:scale-110 active:scale-95 transition-all bg-white/10 p-3 rounded-full backdrop-blur-md">
                       <i id="playBtn" data-lucide="play" class="w-6 h-6 md:w-8 md:h-8 fill-white text-white"></i>
                   </button>
                   <div class="hidden sm:flex items-center gap-3 bg-white/5 p-2 px-4 rounded-2xl border border-white/10">
                       <i data-lucide="volume-2" class="w-4 h-4 text-zinc-400"></i>
                       <input type="range" min="0" max="1" step="0.1" value="1" oninput="setVolume(this.value)" class="w-20 md:w-32 accent-blue-500 cursor-pointer">
                   </div>
               </div>
               <button onclick="handleFullscreen()" class="flex items-center gap-2 bg-blue-600 text-white px-5 md:px-8 py-3 rounded-full font-black text-sm md:text-base hover:bg-blue-500 transition-all shadow-xl active:translate-y-1">
                   <i data-lucide="maximize" class="w-5 h-5"></i>
                   <span class="hidden md:inline">PANTALLA COMPLETA</span>
               </button>
           </div>
       </div>
   </main>
</div>

   const video = document.getElementById('mainVideo');
   const hls = new Hls();

   function loadChannels(filter = "") {
       const container = document.getElementById('channelList');
       container.innerHTML = "";
      
       channels.filter(c => c.name.toLowerCase().includes(filter.toLowerCase())).forEach(ch => {
           const btn = document.createElement('div');
           btn.className = "flex items-center gap-4 p-3 rounded-xl cursor-pointer hover:bg-zinc-900 transition-all border border-transparent hover:border-zinc-800 group mb-1";
           btn.innerHTML = `
               <div class="w-12 h-12 bg-white rounded-lg flex items-center justify-center overflow-hidden p-1 shadow-md group-hover:scale-110 transition-transform">
                    <img src="${ch.logo}" class="max-h-full object-contain">
               </div>
               <div class="flex-1">
                   <p class="font-bold text-zinc-100 text-sm truncate">${ch.name}</p>
                   <p class="text-[9px] text-zinc-500 uppercase tracking-widest">${ch.cat}</p>
               </div>
           `;
           btn.onclick = () => {
               document.querySelectorAll('.active-channel').forEach(el => el.classList.remove('active-channel'));
               btn.classList.add('active-channel');
               playSource(ch);
           };
           container.appendChild(btn);
       });
   }

   function playSource(ch) {
       document.getElementById('playerTitle').innerText = ch.name;
       document.getElementById('currentCat').innerText = ch.cat;
       document.getElementById('currentLogo').src = ch.logo;
       document.getElementById('currentLogo').style.display = 'block';
       document.getElementById('loader').classList.remove('hidden');

       if (Hls.isSupported()) {
           hls.loadSource(ch.url);
           hls.attachMedia(video);
           hls.on(Hls.Events.MANIFEST_PARSED, () => {
               video.play();
               document.getElementById('loader').classList.add('hidden');
           });
       } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
           video.src = ch.url;
           video.play();
           video.addEventListener('loadedmetadata', () => {
               document.getElementById('loader').classList.add('hidden');
           });
       }
       updateIcons('pause');
   }

   function handleFullscreen() {
       const p = document.getElementById('player-section');
       if (!document.fullscreenElement) {
           p.requestFullscreen().then(() => {
               if (screen.orientation && screen.orientation.lock) {
                   screen.orientation.lock('landscape').catch(() => {
                       console.log("Rotaci�n no permitida por el navegador");
                   });
               }
           });
       } else {
           document.exitFullscreen();
           if (screen.orientation && screen.orientation.unlock) {
               screen.orientation.unlock();
           }
       }
   }

   function togglePlay() {
       if (video.paused) { 
           video.play();
           updateIcons('pause'); 
       } else { 
           video.pause(); 
           updateIcons('play');
       }
   }

   function updateIcons(state) {
       document.getElementById('playBtn').setAttribute('data-lucide', state);
       lucide.createIcons();
   }

   function setVolume(v) { 
       video.volume = v; 
   }

   document.getElementById('searchInput').oninput = (e) => loadChannels(e.target.value);
   
   // Inicializaci�n
   loadChannels();
   lucide.createIcons();

   // Auto-ocultar UI
   let timer;
   document.getElementById('player-section').onmousemove = () => {
       const controls = document.querySelectorAll('.video-gradient-top, .video-gradient-bottom');
       controls.forEach(c => c.style.opacity = "1");
       clearTimeout(timer);
       timer = setTimeout(() => {
           if(!video.paused) controls.forEach(c => c.style.opacity = "0");
       }, 3500);
   };
</script>
