<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clappr Player</title>

  <script src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.min.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }
    #player {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

<div id="player"></div>

<script>
new Clappr.Player({
  source: "https://lbgo.bozztv.com/ssh101/ssh101/nene/chunks.m3u8",
  parentId: "#player",
  width: "100%",
  height: "100%",
  autoPlay: true,
  mute: false
});
</script>

</body>
</html>
